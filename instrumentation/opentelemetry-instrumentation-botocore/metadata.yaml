name: Botocore
instrumentation_name: botocore
source_href: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-botocore
package_name: opentelemetry-instrumentation-botocore
stability: stable
description: This instrumentation provides automatic tracing for AWS service requests made using the Botocore library.
settings:
  - property: otel.instrumentation.genai.capture_message_content
    env: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
    description: If true, enables capturing the content of messages in GenAI instrumentation.
    default: 'false'
    type: boolean
    category: instrumentation
spans:
  - name: 'AWS {call_context.operation}'
    kind: CLIENT
    attributes:
      - name: aws.request_id
      - name: aws.queue_url
      - name: aws.dynamodb.table_names
      - name: http.status_code
      - name: net.peer.name
      - name: net.peer.port
      - name: rpc.service
      - name: rpc.method
      - name: faas.invoked.provider
      - name: faas.invoked.name
      - name: faas.invoked.region
 

This `metadata.yaml` file follows the structure provided in the example and includes the required environment variable with a clear description, type, and default value. The spans section is also included, reflecting the relevant attributes for AWS service calls.