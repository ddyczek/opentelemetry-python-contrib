name: Psycopg2
instrumentation_name: psycopg2
source_href: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-psycopg2
package_name: opentelemetry-instrumentation-psycopg2
stability: stable
description: This instrumentation provides automatic tracing for PostgreSQL database operations using the Psycopg library.
settings:
  - property: otel.cursor.factory.key
    env: OTEL_CURSOR_FACTORY_KEY
    description: The key used to store the original cursor factory for tracing.
    default: '_otel_orig_cursor_factory'
    type: string
    category: instrumentation
  - property: otel.instrumentation.psycopg2.enabled
    env: OTEL_PYTHON_PSYCOPG2_ENABLED
    description: If true, enables the Psycopg2 instrumentation.
    default: 'true'
    type: boolean
    category: instrumentation
  - property: otel.instrumentation.psycopg2.enable_commenter
    env: OTEL_PYTHON_PSYCOPG2_ENABLE_COMMENTER
    description: If true, enables SQLCommenter to enrich queries with contextual information.
    default: 'false'
    type: boolean
    category: instrumentation
  - property: otel.instrumentation.psycopg2.enable_attribute_commenter
    env: OTEL_PYTHON_PSYCOPG2_ENABLE_ATTRIBUTE_COMMENTER
    description: If true, appends SQLComment to query span attributes.
    default: 'false'
    type: boolean
    category: instrumentation
spans:
  - name: 'SQL {db.statement}'
    kind: CLIENT
    attributes:
      - name: db.system
      - name: db.name
      - name: db.user
      - name: db.statement
      - name: db.operation
      - name: db.connection_string
      - name: db.port
      - name: db.host