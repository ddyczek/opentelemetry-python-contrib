name: AioPika
instrumentation_name: aio_pika
source_href: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-aio-pika
package_name: opentelemetry-instrumentation-aio-pika
stability: stable
description: This instrumentation provides automatic tracing for RabbitMQ applications using aio_pika.
settings:
  - property: otel.python.aio_pika.enabled
    env: OTEL_PYTHON_AIO_PIKA_ENABLED
    description: If true, enables the AioPika instrumentation.
    default: 'true'
    type: boolean
    category: instrumentation
  - property: otel.instrumentation.aio_pika.capture_headers
    env: OTEL_PYTHON_AIO_PIKA_CAPTURE_HEADERS
    description: A comma-separated list of message header names to capture.
    default: ''
    type: string
    category: instrumentation
spans:
  - name: 'Messaging {operation}'
    kind: CONSUMER
    attributes:
      - messaging.system
      - messaging.destination
      - messaging.message_id
      - messaging.conversation_id
      - net.peer.name
      - net.peer.port


This `metadata.yaml` file includes the necessary environment variables, descriptions, types, and defaults based on the provided source code and follows the structure of the example YAML. The spans section is included to reflect the messaging operations relevant to the AioPika instrumentation.